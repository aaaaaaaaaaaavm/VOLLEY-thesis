name: review-surface

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch checked revision without a marketplace action
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q origin "${{ github.sha }}"
          git checkout -q --detach "${{ github.sha }}"
      - name: Check current reader route and captured evidence
        run: python3 tools/check_review_surface.py
      - name: Prepublication file gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            python3 tools/prepublish_gate.py --all
          else
            git fetch -q origin "$BASE_SHA"
            python3 tools/prepublish_gate.py --base "$BASE_SHA"
          fi
      - name: Gen6 mixed-size full-state screen
        run: python3 analysis/gen6_mixed_mission.py --check
      - name: Gen6 matched four-release campaign
        run: python3 analysis/gen6_matched_campaign.py --check
      - name: Gen6 first-article bounds and CAD mass ledger
        run: python3 analysis/gen6_go2_article_bounds.py --check
      - name: Gen6 source and instrument bounds
        run: python3 analysis/gen6_go2_power_instrument_screen.py --check
      - name: Gen6 G0 surrogate requirements
        run: python3 analysis/gen6_g0_reference.py --check
      - name: Recompute P127 release and arrest bounds
        run: python3 analysis/gen5_release_arrest_bounds.py --check
      - name: Recompute P126 R1 tolerance screen
        run: python3 cad/screen_feeder_r1_tolerance.py --check
      - name: Recompute P125 voltage screen
        run: python3 analysis/gen5_voltage_limited_screen.py --check
      - name: Recompute P123 one-event mass screen
        run: python3 analysis/gen5_one_event_mass_screen.py --check
      - name: Recompute necessary Gen5 architecture bounds
        run: python3 analysis/gen5_architecture_bounds.py --check
